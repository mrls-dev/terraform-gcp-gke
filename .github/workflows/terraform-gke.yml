  #           await github.rest.actions.createWorkflowDispatch({
  #             owner: context.repo.owner,
  #             repo: context.repo.repo,
  #             workflow_id: 'terraform-gke.yml',
  #             ref: 'main',
  #             inputs: {
  #               action: 'destroy',
  #               environment: 'dev'
  #             }
  #           })
